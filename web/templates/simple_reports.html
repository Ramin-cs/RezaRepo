<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARAT - Reports</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-shield-alt me-2"></i>
                ARAT
            </a>
            
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/targets">Targets</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/phases">Phases</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/reports">Reports</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/settings">Settings</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <h2>
                    <i class="fas fa-chart-bar me-2"></i>
                    Reports
                </h2>
            </div>
        </div>

        <!-- Reports -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-file-alt me-2"></i>
                            Reconnaissance Results
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="reports-content">
                            <div class="alert alert-info">
                                <i class="fas fa-info-circle me-2"></i>
                                No reports available yet. Start a reconnaissance scan to generate reports.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Check if there's a target parameter
        const urlParams = new URLSearchParams(window.location.search);
        const target = urlParams.get('target');
        
        if (target) {
            // Load results for specific target
            fetch(`/api/results/${target}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const container = document.getElementById('reports-content');
                        container.innerHTML = `
                            <div class="mb-4">
                                <h4>Results for: ${data.results.target}</h4>
                                <div class="row">
                                    <div class="col-md-3">
                                        <div class="card text-center">
                                            <div class="card-body">
                                                <h5 class="card-title">${data.results.summary.total_phases}</h5>
                                                <p class="card-text">Total Phases</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-3">
                                        <div class="card text-center">
                                            <div class="card-body">
                                                <h5 class="card-title">${data.results.summary.completed_phases}</h5>
                                                <p class="card-text">Completed</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-3">
                                        <div class="card text-center">
                                            <div class="card-body">
                                                <h5 class="card-title">${data.results.summary.subdomains_found}</h5>
                                                <p class="card-text">Subdomains Found</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-3">
                                        <div class="card text-center">
                                            <div class="card-body">
                                                <h5 class="card-title">${data.results.summary.vulnerabilities_found}</h5>
                                                <p class="card-text">Vulnerabilities</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <h5>Phase Results</h5>
                                <div class="accordion" id="phaseAccordion">
                                    ${Object.entries(data.results.phases).map(([phase, result]) => `
                                        <div class="accordion-item">
                                            <h2 class="accordion-header">
                                                <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#${phase}">
                                                    ${phase.replace('_', ' ').toUpperCase()}: ${result.status}
                                                </button>
                                            </h2>
                                            <div id="${phase}" class="accordion-collapse collapse" data-bs-parent="#phaseAccordion">
                                                <div class="accordion-body">
                                                    <pre><code>${JSON.stringify(result, null, 2)}</code></pre>
                                                </div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }
                });
        }
    </script>
</body>
</html>
