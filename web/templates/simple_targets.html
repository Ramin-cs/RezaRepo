<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARAT - Target Management</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-shield-alt me-2"></i>
                ARAT
            </a>
            
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/targets">Targets</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/phases">Phases</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/reports">Reports</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/settings">Settings</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>
                        <i class="fas fa-bullseye me-2"></i>
                        Target Management
                    </h2>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTargetModal">
                        <i class="fas fa-plus me-2"></i>
                        Add New Target
                    </button>
                </div>
            </div>
        </div>

        <!-- Targets Table -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-list me-2"></i>
                            Targets List
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover" id="targets-table">
                                <thead>
                                    <tr>
                                        <th>Target</th>
                                        <th>Description</th>
                                        <th>Status</th>
                                        <th>Phases Completed</th>
                                        <th>Created</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="targets-tbody">
                                    <!-- Targets will be loaded here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Target Modal -->
        <div class="modal fade" id="addTargetModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">
                            <i class="fas fa-plus me-2"></i>
                            Add New Target
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="add-target-form">
                            <div class="mb-3">
                                <label for="target-input" class="form-label">Target</label>
                                <input type="text" class="form-control" id="target-input" name="target" 
                                       placeholder="example.com or 192.168.1.1" required>
                                <div class="form-text">Enter target domain or IP address</div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="target-description" class="form-label">Description</label>
                                <textarea class="form-control" id="target-description" name="description" 
                                          rows="3" placeholder="Optional description about the target..."></textarea>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" id="add-target-btn">
                            <i class="fas fa-plus me-2"></i>
                            Add Target
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Load targets
        function loadTargets() {
            fetch('/api/targets')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const tbody = document.getElementById('targets-tbody');
                        if (data.targets.length === 0) {
                            tbody.innerHTML = `
                                <tr>
                                    <td colspan="6" class="text-center text-muted">
                                        No targets found. Add a target to get started.
                                    </td>
                                </tr>
                            `;
                        } else {
                            tbody.innerHTML = data.targets.map(target => `
                                <tr>
                                    <td>${target.target}</td>
                                    <td>${target.description || '-'}</td>
                                    <td><span class="badge bg-success">${target.status}</span></td>
                                    <td>${target.phases_completed}</td>
                                    <td>${new Date(target.created_at).toLocaleDateString()}</td>
                                    <td>
                                        <button class="btn btn-sm btn-primary" onclick="startScan('${target.target}')">
                                            <i class="fas fa-play me-1"></i>
                                            Scan
                                        </button>
                                        <button class="btn btn-sm btn-info" onclick="viewResults('${target.target}')">
                                            <i class="fas fa-eye me-1"></i>
                                            Results
                                        </button>
                                    </td>
                                </tr>
                            `).join('');
                        }
                    }
                });
        }

        // Add target
        document.getElementById('add-target-btn').addEventListener('click', function() {
            const target = document.getElementById('target-input').value.trim();
            const description = document.getElementById('target-description').value.trim();
            
            if (!target) {
                alert('Please enter a target');
                return;
            }
            
            fetch('/api/targets', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    target: target,
                    description: description
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Target added successfully!');
                    
                    // Close modal
                    const modal = bootstrap.Modal.getInstance(document.getElementById('addTargetModal'));
                    modal.hide();
                    
                    // Clear form
                    document.getElementById('target-input').value = '';
                    document.getElementById('target-description').value = '';
                    
                    // Reload targets
                    loadTargets();
                } else {
                    alert('Error: ' + data.error);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error adding target');
            });
        });

        // Start scan
        function startScan(target) {
            window.location.href = `/phases?target=${encodeURIComponent(target)}`;
        }

        // View results
        function viewResults(target) {
            window.location.href = `/reports?target=${encodeURIComponent(target)}`;
        }

        // Load targets on page load
        loadTargets();
    </script>
</body>
</html>
