<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARAT - Reconnaissance Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/hacker_theme.css') }}" rel="stylesheet">
    <style>
        .report-container {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .report-card {
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid #00ff00;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.1);
        }
        .report-header {
            background: rgba(0, 255, 0, 0.1);
            border-bottom: 1px solid #00ff00;
            padding: 20px;
            border-radius: 10px 10px 0 0;
        }
        .phase-result {
            background: rgba(0, 255, 0, 0.03);
            border: 1px solid rgba(0, 255, 0, 0.3);
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 15px;
        }
        .phase-title {
            color: #00ff00;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .result-item {
            background: rgba(0, 255, 0, 0.02);
            border-left: 3px solid #00ff00;
            padding: 10px;
            margin: 5px 0;
            border-radius: 0 5px 5px 0;
        }
        .status-completed {
            color: #00ff00;
        }
        .status-error {
            color: #ff0000;
        }
        .status-running {
            color: #ffff00;
        }
        .technique-item {
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid rgba(0, 255, 0, 0.2);
            border-radius: 5px;
            padding: 8px;
            margin: 3px 0;
            font-size: 0.9em;
        }
        .export-btn {
            background: linear-gradient(45deg, #00ff00, #00cc00);
            border: none;
            color: #000;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 5px;
            margin: 5px;
        }
        .export-btn:hover {
            background: linear-gradient(45deg, #00cc00, #00ff00);
            color: #000;
        }
        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid #00ff00;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #00ff00;
        }
        .stat-label {
            color: #ccc;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="report-container">
        <div class="container-fluid">
            <!-- Header -->
            <div class="report-card">
                <div class="report-header">
                    <h1><i class="fas fa-shield-alt"></i> ARAT Reconnaissance Report</h1>
                    <p class="mb-0">Target: <strong id="report-target">{{ target }}</strong></p>
                    <p class="mb-0">Generated: <strong id="report-date">{{ date }}</strong></p>
                    <p class="mb-0">Status: <span class="status-completed" id="report-status">Completed</span></p>
                </div>
            </div>

            <!-- Summary Statistics -->
            <div class="summary-stats" id="summary-stats">
                <!-- Stats will be populated by JavaScript -->
            </div>

            <!-- Export Buttons -->
            <div class="text-center mb-4">
                <button class="export-btn" onclick="exportReport('json')">
                    <i class="fas fa-download"></i> Export JSON
                </button>
                <button class="export-btn" onclick="exportReport('html')">
                    <i class="fas fa-download"></i> Export HTML
                </button>
                <button class="export-btn" onclick="exportReport('csv')">
                    <i class="fas fa-download"></i> Export CSV
                </button>
                <button class="export-btn" onclick="window.print()">
                    <i class="fas fa-print"></i> Print Report
                </button>
            </div>

            <!-- Phase Results -->
            <div id="phase-results">
                <!-- Phase results will be populated by JavaScript -->
            </div>

            <!-- Back to Dashboard -->
            <div class="text-center mt-4">
                <a href="/phases" class="export-btn">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load report data
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const target = urlParams.get('target');
            const taskId = urlParams.get('task_id');
            
            if (target) {
                document.getElementById('report-target').textContent = target;
            }
            
            if (taskId) {
                loadReportData(taskId);
            } else {
                // Load from localStorage if available
                const savedResults = localStorage.getItem('lastReconResults');
                if (savedResults) {
                    displayReport(JSON.parse(savedResults));
                }
            }
        });

        function loadReportData(taskId) {
            fetch(`/api/results/${taskId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        displayReport(data.task);
                    } else {
                        console.error('Failed to load report data:', data.error);
                    }
                })
                .catch(error => {
                    console.error('Error loading report data:', error);
                });
        }

        function displayReport(taskData) {
            const results = taskData.results || {};
            const summaryStats = calculateSummaryStats(results);
            displaySummaryStats(summaryStats);
            displayPhaseResults(results);
        }

        function calculateSummaryStats(results) {
            const stats = {
                totalPhases: 0,
                completedPhases: 0,
                totalTechniques: 0,
                totalFindings: 0,
                totalErrors: 0
            };

            for (const [phaseKey, result] of Object.entries(results)) {
                if (phaseKey.startsWith('phase_')) {
                    stats.totalPhases++;
                    if (result.status === 'completed') {
                        stats.completedPhases++;
                    }
                    if (result.techniques_used) {
                        stats.totalTechniques += result.techniques_used.length;
                    }
                    if (result.errors) {
                        stats.totalErrors += result.errors.length;
                    }
                    
                    // Count specific findings based on phase
                    const phaseNum = parseInt(phaseKey.split('_')[1]);
                    switch(phaseNum) {
                        case 1: // Real IP
                            if (result.real_ips) stats.totalFindings += result.real_ips.length;
                            break;
                        case 2: // Subdomains
                            if (result.subdomains) stats.totalFindings += result.subdomains.length;
                            break;
                        case 3: // Ports
                            if (result.open_ports) stats.totalFindings += result.open_ports.length;
                            break;
                        case 4: // Technologies
                            if (result.technologies) stats.totalFindings += result.technologies.length;
                            break;
                        case 5: // Directories
                            if (result.directories_found) stats.totalFindings += result.directories_found.length;
                            if (result.files_found) stats.totalFindings += result.files_found.length;
                            break;
                        case 6: // Parameters
                            if (result.parameters_found) stats.totalFindings += result.parameters_found.length;
                            if (result.endpoints_found) stats.totalFindings += result.endpoints_found.length;
                            break;
                        case 7: // Endpoints
                            if (result.endpoints_found) stats.totalFindings += result.endpoints_found.length;
                            break;
                        case 8: // Cloud
                            if (result.cloud_services) stats.totalFindings += result.cloud_services.length;
                            break;
                        case 9: // OSINT
                            if (result.osint_data) stats.totalFindings += Object.keys(result.osint_data).length;
                            break;
                        case 10: // Vulnerabilities
                            if (result.vulnerabilities) stats.totalFindings += result.vulnerabilities.length;
                            break;
                    }
                }
            }

            return stats;
        }

        function displaySummaryStats(stats) {
            const summaryContainer = document.getElementById('summary-stats');
            summaryContainer.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${stats.totalPhases}</div>
                    <div class="stat-label">Total Phases</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${stats.completedPhases}</div>
                    <div class="stat-label">Completed Phases</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${stats.totalTechniques}</div>
                    <div class="stat-label">Techniques Used</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${stats.totalFindings}</div>
                    <div class="stat-label">Total Findings</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${stats.totalErrors}</div>
                    <div class="stat-label">Errors</div>
                </div>
            `;
        }

        function displayPhaseResults(results) {
            const phaseNames = {
                1: 'Real IP Extraction & CDN Bypass',
                2: 'Subdomain Discovery',
                3: 'Port Scanning & Service Detection',
                4: 'Technology Detection',
                5: 'Directory Discovery',
                6: 'Parameter Discovery & JS Analysis',
                7: 'Endpoint Discovery (REST/GraphQL)',
                8: 'Cloud Analysis',
                9: 'OSINT Analysis',
                10: 'Vulnerability Assessment'
            };

            const resultsContainer = document.getElementById('phase-results');
            let html = '';

            for (let i = 1; i <= 10; i++) {
                const phaseKey = `phase_${i}`;
                const result = results[phaseKey];
                
                if (result) {
                    html += `
                        <div class="phase-result">
                            <div class="phase-title">
                                <i class="fas fa-check-circle"></i> Phase ${i}: ${phaseNames[i]}
                                <span class="float-end status-${result.status}">${result.status.toUpperCase()}</span>
                            </div>
                            <div class="row">
                                <div class="col-md-8">
                                    <p><strong>Summary:</strong> ${result.summary || 'No summary available'}</p>
                                    ${displayPhaseSpecificResults(result, i)}
                                </div>
                                <div class="col-md-4">
                                    ${result.techniques_used ? `
                                        <h6>Techniques Used:</h6>
                                        ${result.techniques_used.map(tech => `<div class="technique-item">${tech}</div>`).join('')}
                                    ` : ''}
                                    ${result.errors && result.errors.length > 0 ? `
                                        <h6 class="text-danger">Errors:</h6>
                                        ${result.errors.map(error => `<div class="text-danger">${error}</div>`).join('')}
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="phase-result">
                            <div class="phase-title">
                                <i class="fas fa-times-circle"></i> Phase ${i}: ${phaseNames[i]}
                                <span class="float-end text-muted">NOT RUN</span>
                            </div>
                            <p class="text-muted">This phase was not executed.</p>
                        </div>
                    `;
                }
            }

            resultsContainer.innerHTML = html;
        }

        function displayPhaseSpecificResults(result, phaseNum) {
            let html = '';

            switch(phaseNum) {
                case 1: // Real IP
                    if (result.real_ips && result.real_ips.length > 0) {
                        html += '<h6>Real IPs Found:</h6>';
                        result.real_ips.forEach(ip => {
                            html += `<div class="result-item">${ip.ip} (${ip.source})</div>`;
                        });
                    }
                    break;
                case 2: // Subdomains
                    if (result.subdomains && result.subdomains.length > 0) {
                        html += '<h6>Subdomains Found:</h6>';
                        result.subdomains.slice(0, 10).forEach(sub => {
                            html += `<div class="result-item">${sub.subdomain} (${sub.source})</div>`;
                        });
                        if (result.subdomains.length > 10) {
                            html += `<div class="result-item">... and ${result.subdomains.length - 10} more</div>`;
                        }
                    }
                    break;
                case 3: // Ports
                    if (result.open_ports && result.open_ports.length > 0) {
                        html += '<h6>Open Ports:</h6>';
                        result.open_ports.forEach(port => {
                            html += `<div class="result-item">Port ${port} - ${result.services[port] || 'Unknown service'}</div>`;
                        });
                    }
                    break;
                case 4: // Technologies
                    if (result.technologies && result.technologies.length > 0) {
                        html += '<h6>Technologies Found:</h6>';
                        result.technologies.forEach(tech => {
                            html += `<div class="result-item">${tech}</div>`;
                        });
                    }
                    break;
                case 5: // Directories
                    if (result.directories_found && result.directories_found.length > 0) {
                        html += '<h6>Directories Found:</h6>';
                        result.directories_found.slice(0, 5).forEach(dir => {
                            html += `<div class="result-item">${dir.path} (${dir.status_code})</div>`;
                        });
                        if (result.directories_found.length > 5) {
                            html += `<div class="result-item">... and ${result.directories_found.length - 5} more directories</div>`;
                        }
                    }
                    if (result.files_found && result.files_found.length > 0) {
                        html += '<h6>Files Found:</h6>';
                        result.files_found.slice(0, 5).forEach(file => {
                            html += `<div class="result-item">${file.path} (${file.status_code})</div>`;
                        });
                        if (result.files_found.length > 5) {
                            html += `<div class="result-item">... and ${result.files_found.length - 5} more files</div>`;
                        }
                    }
                    break;
                case 6: // Parameters
                    if (result.parameters_found && result.parameters_found.length > 0) {
                        html += '<h6>Parameters Found:</h6>';
                        result.parameters_found.slice(0, 10).forEach(param => {
                            html += `<div class="result-item">${param.parameter} (${param.type})</div>`;
                        });
                        if (result.parameters_found.length > 10) {
                            html += `<div class="result-item">... and ${result.parameters_found.length - 10} more parameters</div>`;
                        }
                    }
                    if (result.endpoints_found && result.endpoints_found.length > 0) {
                        html += '<h6>Endpoints Found:</h6>';
                        result.endpoints_found.slice(0, 5).forEach(endpoint => {
                            html += `<div class="result-item">${endpoint}</div>`;
                        });
                        if (result.endpoints_found.length > 5) {
                            html += `<div class="result-item">... and ${result.endpoints_found.length - 5} more endpoints</div>`;
                        }
                    }
                    break;
                case 7: // Endpoints
                    if (result.endpoints_found && result.endpoints_found.length > 0) {
                        html += '<h6>API Endpoints:</h6>';
                        result.endpoints_found.slice(0, 10).forEach(endpoint => {
                            html += `<div class="result-item">${endpoint}</div>`;
                        });
                        if (result.endpoints_found.length > 10) {
                            html += `<div class="result-item">... and ${result.endpoints_found.length - 10} more endpoints</div>`;
                        }
                    }
                    break;
                case 8: // Cloud
                    if (result.cloud_services && result.cloud_services.length > 0) {
                        html += '<h6>Cloud Services:</h6>';
                        result.cloud_services.forEach(service => {
                            html += `<div class="result-item">${service}</div>`;
                        });
                    }
                    break;
                case 9: // OSINT
                    if (result.osint_data) {
                        html += '<h6>OSINT Data:</h6>';
                        for (const [key, value] of Object.entries(result.osint_data)) {
                            html += `<div class="result-item"><strong>${key}:</strong> ${JSON.stringify(value)}</div>`;
                        }
                    }
                    break;
                case 10: // Vulnerabilities
                    if (result.vulnerabilities && result.vulnerabilities.length > 0) {
                        html += '<h6>Vulnerabilities Found:</h6>';
                        result.vulnerabilities.forEach(vuln => {
                            html += `<div class="result-item ${vuln.severity}">${vuln.name} (${vuln.severity})</div>`;
                        });
                    }
                    break;
            }

            return html;
        }

        function exportReport(format) {
            const reportData = {
                target: document.getElementById('report-target').textContent,
                date: document.getElementById('report-date').textContent,
                status: document.getElementById('report-status').textContent,
                results: JSON.parse(localStorage.getItem('lastReconResults') || '{}')
            };

            let content, filename, mimeType;

            switch(format) {
                case 'json':
                    content = JSON.stringify(reportData, null, 2);
                    filename = `arat-report-${reportData.target}-${new Date().toISOString().split('T')[0]}.json`;
                    mimeType = 'application/json';
                    break;
                case 'html':
                    content = document.documentElement.outerHTML;
                    filename = `arat-report-${reportData.target}-${new Date().toISOString().split('T')[0]}.html`;
                    mimeType = 'text/html';
                    break;
                case 'csv':
                    content = convertToCSV(reportData);
                    filename = `arat-report-${reportData.target}-${new Date().toISOString().split('T')[0]}.csv`;
                    mimeType = 'text/csv';
                    break;
            }

            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function convertToCSV(data) {
            let csv = 'Phase,Status,Summary,Techniques,Findings\n';
            
            for (let i = 1; i <= 10; i++) {
                const phaseKey = `phase_${i}`;
                const result = data.results[phaseKey];
                
                if (result) {
                    const techniques = result.techniques_used ? result.techniques_used.length : 0;
                    const findings = calculatePhaseFindings(result, i);
                    csv += `Phase ${i},${result.status},"${result.summary || ''}",${techniques},${findings}\n`;
                } else {
                    csv += `Phase ${i},Not Run,Not executed,0,0\n`;
                }
            }
            
            return csv;
        }

        function calculatePhaseFindings(result, phaseNum) {
            let findings = 0;
            
            switch(phaseNum) {
                case 1: findings = result.real_ips ? result.real_ips.length : 0; break;
                case 2: findings = result.subdomains ? result.subdomains.length : 0; break;
                case 3: findings = result.open_ports ? result.open_ports.length : 0; break;
                case 4: findings = result.technologies ? result.technologies.length : 0; break;
                case 5: findings = (result.directories_found ? result.directories_found.length : 0) + (result.files_found ? result.files_found.length : 0); break;
                case 6: findings = (result.parameters_found ? result.parameters_found.length : 0) + (result.endpoints_found ? result.endpoints_found.length : 0); break;
                case 7: findings = result.endpoints_found ? result.endpoints_found.length : 0; break;
                case 8: findings = result.cloud_services ? result.cloud_services.length : 0; break;
                case 9: findings = result.osint_data ? Object.keys(result.osint_data).length : 0; break;
                case 10: findings = result.vulnerabilities ? result.vulnerabilities.length : 0; break;
            }
            
            return findings;
        }
    </script>
</body>
</html>
