<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARAT - Reconnaissance Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/hacker_theme.css" rel="stylesheet">
    <style>
        .finding-card {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }
        .finding-success {
            border-left: 4px solid #28a745;
        }
        .finding-info {
            border-left: 4px solid #17a2b8;
        }
        .finding-warning {
            border-left: 4px solid #ffc107;
        }
        .finding-item {
            background: #333;
            padding: 8px;
            margin: 3px 0;
            border-radius: 4px;
            font-size: 12px;
            font-family: monospace;
        }
        .phase-summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-crosshairs me-2"></i>ARAT
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link" href="/targets">Targets</a>
                <a class="nav-link" href="/phases">Phases</a>
                <a class="nav-link active" href="#">Report</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Report Header -->
        <div class="phase-summary">
            <div class="row">
                <div class="col-md-8">
                    <h2><i class="fas fa-file-alt me-2"></i>Reconnaissance Report</h2>
                    <h4 id="report-target">Target: Loading...</h4>
                    <p id="report-summary" class="mb-0">Generating report...</p>
                </div>
                <div class="col-md-4 text-end">
                    <button class="btn btn-light me-2" onclick="exportReport('json')">
                        <i class="fas fa-download me-2"></i>Export JSON
                    </button>
                    <button class="btn btn-outline-light" onclick="exportReport('csv')">
                        <i class="fas fa-file-csv me-2"></i>Export CSV
                    </button>
                </div>
            </div>
        </div>

        <!-- Phase Results -->
        <div id="phase-results-container">
            <div class="text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3">Loading reconnaissance results...</p>
                <div class="progress mt-3" style="height: 20px;">
                    <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" 
                         role="progressbar" style="width: 0%">0%</div>
                </div>
            </div>
        </div>

        <!-- Summary Statistics -->
        <div class="row mt-4">
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-primary">
                            <i class="fas fa-target me-2"></i>Target
                        </h5>
                        <h3 id="stat-target" class="text-primary">-</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-success">
                            <i class="fas fa-check-circle me-2"></i>Phases
                        </h5>
                        <h3 id="stat-phases" class="text-success">-</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-info">
                            <i class="fas fa-search me-2"></i>Findings
                        </h5>
                        <h3 id="stat-findings" class="text-info">-</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-warning">
                            <i class="fas fa-clock me-2"></i>Duration
                        </h5>
                        <h3 id="stat-duration" class="text-warning">-</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="row mt-4">
            <div class="col-12 text-center">
                <button class="btn btn-primary me-2" onclick="runNewScan()">
                    <i class="fas fa-redo me-2"></i>Run New Scan
                </button>
                <button class="btn btn-secondary me-2" onclick="window.print()">
                    <i class="fas fa-print me-2"></i>Print Report
                </button>
                <button class="btn btn-info" onclick="window.location.href='/'">
                    <i class="fas fa-home me-2"></i>Back to Dashboard
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let reportData = {};

        // Load report data
        function loadReportData() {
            const urlParams = new URLSearchParams(window.location.search);
            const target = urlParams.get('target');
            const taskId = urlParams.get('task_id');
            
            console.log('Loading report for:', { target, taskId });
            
            if (target) {
                document.getElementById('report-target').textContent = `Target: ${target}`;
                document.getElementById('stat-target').textContent = target;
            }
            
            // Try to load from localStorage first
            const storedResults = localStorage.getItem('lastReconResults');
            if (storedResults) {
                try {
                    const parsedData = JSON.parse(storedResults);
                    console.log('📊 Loaded data from localStorage:', parsedData);
                    
                    // Use the stored data
                    reportData = parsedData;
                    
                    // Display the report
                    if (parsedData.results || parsedData.phaseResults) {
                        displayReport(parsedData);
                    } else {
                        showNoDataMessage();
                    }
                } catch (e) {
                    console.error('Error parsing stored results:', e);
                    showNoDataMessage();
                }
            } else {
                console.log('No stored results found in localStorage');
                showNoDataMessage();
            }
            
            // If we have taskId, try to fetch from API as backup
            if (taskId) {
                fetch(`/api/results/${taskId}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            console.log('📊 Loaded data from API:', data.results);
                            reportData = data.results;
                            displayReport(data.results);
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching results from API:', error);
                    });
            }
        }
        
        function showNoDataMessage() {
            const container = document.getElementById('phase-results-container');
            container.innerHTML = `
                <div class="text-center text-muted">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    No reconnaissance data found. Please run a scan first.
                    <br><small>Go to <a href="/phases">Phases page</a> to start reconnaissance.</small>
                </div>
            `;
        }

        // Display report
        function displayReport(data) {
            console.log('Displaying report with optimized rendering...');
            
            const container = document.getElementById('phase-results-container');
            container.innerHTML = '';
            
            try {
                // Extract data from different possible structures
                let phaseData = {};
                let totalFindings = 0;
                let phaseCount = 0;
                
                // Check if data has results property
                if (data.results) {
                    phaseData = data.results;
                } else if (data.phaseResults) {
                    phaseData = data.phaseResults;
                } else {
                    phaseData = data;
                }
                
                // Calculate statistics efficiently
                const phases = Object.keys(phaseData).filter(key => key.startsWith('phase_') || key.match(/^\d+$/));
                
                // Process phases in batches to avoid blocking the UI
                let currentPhaseIndex = 0;
                const batchSize = 2; // Process 2 phases at a time
                
                function processNextBatch() {
                    const endIndex = Math.min(currentPhaseIndex + batchSize, phases.length);
                    
                    for (let i = currentPhaseIndex; i < endIndex; i++) {
                        const phaseKey = phases[i];
                        const phase = phaseData[phaseKey];
                        
                        if (phase) {
                            // Count findings efficiently
                            const findings = extractFindingsFromPhase(phase, phaseKey);
                            totalFindings += findings.length;
                            phaseCount++;
                            
                            // Create and append phase card
                            const phaseDiv = createPhaseCard(phaseKey, phase, findings);
                            container.appendChild(phaseDiv);
                        }
                    }
                    
                    currentPhaseIndex = endIndex;
                    
                    // Update progress
                    const progress = Math.round((currentPhaseIndex / phases.length) * 100);
                    updateProgress(progress);
                    
                    // Continue processing if there are more phases
                    if (currentPhaseIndex < phases.length) {
                        setTimeout(processNextBatch, 10); // Small delay to keep UI responsive
                    } else {
                        // All phases processed, update final statistics
                        updateFinalStatistics(phaseCount, totalFindings, data);
                    }
                }
                
                // Start processing
                if (phases.length > 0) {
                    processNextBatch();
                } else {
                    showNoDataMessage();
                }
                
            } catch (error) {
                console.error('Error displaying report:', error);
                showErrorMessage('Error displaying report: ' + error.message);
            }
        }
        
        function extractFindingsFromPhase(phase, phaseKey) {
            const phaseNumber = phaseKey.replace('phase_', '');
            let findings = [];
            
            try {
                // Extract findings based on phase structure
                if (phase.findings && Array.isArray(phase.findings)) {
                    findings = phase.findings;
                } else {
                    // Extract from direct properties
                    switch(phaseNumber) {
                        case '1':
                            if (phase.real_ips) findings = findings.concat(phase.real_ips);
                            if (phase.ip_mapping) findings = findings.concat(Object.keys(phase.ip_mapping));
                            if (phase.ip_to_subdomain) {
                                // Add IP to subdomain mapping as special finding
                                Object.entries(phase.ip_to_subdomain).forEach(([ip, subdomains]) => {
                                    findings.push({
                                        type: 'ip_subdomain_mapping',
                                        ip: ip,
                                        subdomains: subdomains,
                                        display: `${ip} → ${subdomains.join(', ')}`
                                    });
                                });
                            }
                            break;
                        case '2':
                            if (phase.subdomains) findings = findings.concat(phase.subdomains);
                            if (phase.valid_subdomains) findings = findings.concat(phase.valid_subdomains);
                            break;
                        case '3':
                            if (phase.open_ports) findings = findings.concat(phase.open_ports);
                            break;
                        case '4':
                            if (phase.technologies) findings = findings.concat(phase.technologies);
                            break;
                        case '5':
                            if (phase.directories_found) findings = findings.concat(phase.directories_found);
                            if (phase.files_found) findings = findings.concat(phase.files_found);
                            break;
                        case '6':
                            if (phase.parameters_found) findings = findings.concat(phase.parameters_found);
                            if (phase.endpoints_found) findings = findings.concat(phase.endpoints_found);
                            break;
                        case '7':
                            if (phase.endpoints_found) findings = findings.concat(phase.endpoints_found);
                            break;
                        case '8':
                            if (phase.aws_buckets) findings = findings.concat(phase.aws_buckets);
                            if (phase.azure_blobs) findings = findings.concat(phase.azure_blobs);
                            if (phase.gcp_buckets) findings = findings.concat(phase.gcp_buckets);
                            break;
                        case '9':
                            if (phase.whois_info) findings.push('WHOIS Data');
                            if (phase.dns_history) findings = findings.concat(phase.dns_history);
                            break;
                        case '10':
                            if (phase.vulnerabilities) findings = findings.concat(phase.vulnerabilities);
                            if (phase.subdomain_takeover_vulns) findings = findings.concat(phase.subdomain_takeover_vulns);
                            break;
                    }
                }
                
                // Limit findings to prevent UI overload
                return findings.slice(0, 100);
                
            } catch (error) {
                console.error(`Error extracting findings from phase ${phaseKey}:`, error);
                return [];
            }
        }
        
        function updateProgress(progress) {
            const progressElement = document.getElementById('progress-bar');
            if (progressElement) {
                progressElement.style.width = progress + '%';
                progressElement.textContent = progress + '%';
            }
        }
        
        function updateFinalStatistics(phaseCount, totalFindings, data) {
            document.getElementById('stat-phases').textContent = phaseCount;
            document.getElementById('stat-findings').textContent = totalFindings;
            document.getElementById('stat-duration').textContent = data.duration || 'N/A';
            
            document.getElementById('report-summary').textContent = 
                `Completed ${phaseCount} phases with ${totalFindings} total findings`;
        }
        
        function showErrorMessage(message) {
            const container = document.getElementById('phase-results-container');
            container.innerHTML = `
                <div class="alert alert-danger">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    ${message}
                </div>
            `;
        }

        // Create phase card
        function createPhaseCard(phaseKey, phaseData, findings = []) {
            const phaseNumber = phaseKey.replace('phase_', '');
            const phaseNames = {
                '1': 'Real IP Extraction',
                '2': 'Subdomain Discovery',
                '3': 'Port Scanning',
                '4': 'Technology Detection',
                '5': 'Directory Discovery',
                '6': 'Parameter Discovery',
                '7': 'Endpoint Discovery',
                '8': 'Cloud Analysis',
                '9': 'OSINT Analysis',
                '10': 'Vulnerability Assessment'
            };
            
            const phaseName = phaseNames[phaseNumber] || `Phase ${phaseNumber}`;
            let status = phaseData.status || 'completed';
            
            // Use provided findings or extract from phase data
            if (!findings || findings.length === 0) {
                findings = extractFindingsFromPhase(phaseData, phaseKey);
            }
            
            // Limit findings display to prevent UI overload
            const displayFindings = findings.slice(0, 50);
            const hasMoreFindings = findings.length > 50;
            
            if (phaseData.status) {
                status = phaseData.status;
            }
            
            const cardDiv = document.createElement('div');
            cardDiv.className = `finding-card finding-${status === 'completed' ? 'success' : 'warning'}`;
            
            cardDiv.innerHTML = `
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">
                        <i class="fas fa-${status === 'completed' ? 'check-circle text-success' : 'exclamation-triangle text-warning'} me-2"></i>
                        Phase ${phaseNumber}: ${phaseName}
                    </h5>
                    <span class="badge bg-${status === 'completed' ? 'success' : 'warning'}">
                        ${findings.length} findings
                    </span>
                </div>
                <div class="phase-findings">
                    ${formatPhaseFindings({ findings: findings, ...phaseData })}
                </div>
            `;
            
            return cardDiv;
        }

        // Format phase findings
        function formatPhaseFindings(phaseData) {
            let html = '';
            const findings = phaseData.findings || [];
            
            if (findings.length === 0) {
                // Check for direct properties
                const directProps = ['real_ips', 'subdomains', 'open_ports', 'technologies', 'directories_found', 'files_found', 'parameters_found', 'endpoints_found', 'secrets', 'form_parameters', 'url_parameters', 'javascript_variables', 'http_headers', 'meta_tags', 'cookie_parameters', 'rest_endpoints', 'graphql_endpoints', 'api_docs', 'openapi_specs', 'aws_buckets', 'azure_blobs', 'gcp_buckets', 'cloudflare_resources', 'cloud_services', 'dns_history', 'certificate_transparency', 'social_media', 'breach_data', 'osint_data', 'security_headers', 'http_methods', 'cors_issues', 'csp_issues', 'subdomain_takeover_vulns', 'vulnerabilities'];
                let hasDirectData = false;
                
                // Special handling for IP to Subdomain mapping
                if (phaseData.ip_to_subdomain) {
                    hasDirectData = true;
                    html += `<div class="finding-category mb-2">
                        <strong class="text-info">🔗 IP to Subdomain Mapping:</strong>
                    </div>`;
                    
                    Object.entries(phaseData.ip_to_subdomain).forEach(([ip, subdomains]) => {
                        html += `<div class="finding-item">
                            <strong class="text-primary">${ip}</strong> → 
                            <span class="text-success">${subdomains.join(', ')}</span>
                        </div>`;
                    });
                }
                
                directProps.forEach(prop => {
                    if (phaseData[prop] && phaseData[prop].length > 0) {
                        hasDirectData = true;
                        
                        // Special handling for valid_subdomains
                        if (prop === 'valid_subdomains') {
                            html += `<div class="finding-category mb-2">
                                <strong class="text-info">✅ Valid Subdomains (with IP addresses):</strong>
                            </div>`;
                            
                            phaseData[prop].slice(0, 10).forEach(item => {
                                if (typeof item === 'object' && item.subdomain && item.ip) {
                                    html += `<div class="finding-item">
                                        <strong class="text-success">${item.subdomain}</strong> 
                                        <span class="text-muted">(${item.ip})</span> 
                                        <span class="badge bg-${item.protocol === 'https' ? 'success' : 'warning'}">${item.protocol}</span>
                                        <span class="badge bg-info">${item.status_code}</span>
                                    </div>`;
                                } else {
                                    html += `<div class="finding-item">${item}</div>`;
                                }
                            });
                        } else {
                            html += `<div class="finding-category mb-2">
                                <strong class="text-info">${prop.replace('_', ' ').charAt(0).toUpperCase() + prop.replace('_', ' ').slice(1)}:</strong>
                            </div>`;
                            
                            phaseData[prop].slice(0, 10).forEach(item => {
                                html += `<div class="finding-item">${item}</div>`;
                            });
                        }
                        
                        if (phaseData[prop].length > 10) {
                            html += `<div class="finding-item text-muted">... and ${phaseData[prop].length - 10} more</div>`;
                        }
                    }
                });
                
                // Check for WHOIS info (special case)
                if (phaseData.whois_info) {
                    hasDirectData = true;
                    html += `<div class="finding-category mb-2">
                        <strong class="text-info">WHOIS Information:</strong>
                    </div>`;
                    html += `<div class="finding-item">WHOIS information collected</div>`;
                }
                
                if (!hasDirectData) {
                    return '<div class="text-muted">No specific findings to display</div>';
                }
                
                return html;
            }
            
            // Group findings by type
            const groupedFindings = {};
            findings.forEach(finding => {
                const type = finding.type || 'general';
                if (!groupedFindings[type]) {
                    groupedFindings[type] = [];
                }
                groupedFindings[type].push(finding);
            });
            
            // Display each group
            Object.keys(groupedFindings).forEach(type => {
                const groupFindings = groupedFindings[type];
                html += `<div class="finding-category mb-2">
                    <strong class="text-info">${type.replace('_', ' ').charAt(0).toUpperCase() + type.replace('_', ' ').slice(1)}:</strong>
                </div>`;
                
                groupFindings.slice(0, 10).forEach(finding => {
                    let displayText = finding.value || finding;
                    
                    // Enhanced display for different types
                    if (finding.type === 'ip_mapping' && finding.details) {
                        displayText = `${finding.value}`;
                        if (finding.details.reverse_dns) {
                            displayText += ` (${finding.details.reverse_dns})`;
                        }
                        if (finding.details.source) {
                            displayText += ` [${finding.details.source}]`;
                        }
                    } else if (finding.type === 'subdomain_detail' && finding.details) {
                        displayText = `${finding.value}`;
                        if (finding.details.status_code) {
                            displayText += ` [${finding.details.status_code}]`;
                        }
                        if (finding.details.source) {
                            displayText += ` (${finding.details.source})`;
                        }
                    } else if (finding.type === 'valid_subdomain') {
                        displayText = `${finding.value} (Valid)`;
                    } else if (finding.type === 'swagger_endpoint' && finding.details) {
                        displayText = `${finding.value}`;
                        if (finding.details.title) {
                            displayText += ` - ${finding.details.title}`;
                        }
                        if (finding.details.status_code) {
                            displayText += ` [${finding.details.status_code}]`;
                        }
                    } else if (finding.type === 'js_endpoint' && finding.details) {
                        displayText = `${finding.value}`;
                        if (finding.details.source) {
                            displayText += ` (${finding.details.source})`;
                        }
                    } else if (finding.type === 'account_takeover' && finding.details) {
                        displayText = `${finding.value}`;
                        if (finding.details.severity) {
                            displayText += ` [${finding.details.severity}]`;
                        }
                        if (finding.details.url) {
                            displayText += ` - ${finding.details.url}`;
                        }
                    } else if (finding.type === 'subdomain_takeover' && finding.details) {
                        displayText = `${finding.value}`;
                        if (finding.details.severity) {
                            displayText += ` [${finding.details.severity}]`;
                        }
                        if (finding.details.service) {
                            displayText += ` (${finding.details.service})`;
                        }
                    } else if (finding.type === 'directory' && finding.details) {
                        displayText = `${finding.value}`;
                        if (finding.details.status_code) {
                            displayText += ` [${finding.details.status_code}]`;
                        }
                        if (finding.details.content_length) {
                            displayText += ` (${finding.details.content_length} bytes)`;
                        }
                    } else if (finding.type === 'parameter' && finding.details) {
                        displayText = `${finding.value}`;
                        if (finding.details.risk_level) {
                            displayText += ` [${finding.details.risk_level}]`;
                        }
                        if (finding.details.source) {
                            displayText += ` (${finding.details.source})`;
                        }
                    } else if (finding.type === 'form_parameter') {
                        displayText = `${finding.value} (Form)`;
                    } else if (finding.type === 'js_variable') {
                        displayText = `${finding.value} (JS Variable)`;
                    } else if (finding.type === 'http_header') {
                        displayText = `${finding.value} (HTTP Header)`;
                    } else if (finding.type === 'meta_tag') {
                        displayText = `${finding.value} (Meta Tag)`;
                    } else if (finding.type === 'cookie_parameter') {
                        displayText = `${finding.value} (Cookie)`;
                    } else if (finding.type === 'rest_endpoint') {
                        displayText = `${finding.value} (REST)`;
                    } else if (finding.type === 'graphql_endpoint') {
                        displayText = `${finding.value} (GraphQL)`;
                    } else if (finding.type === 'api_doc') {
                        displayText = `${finding.value} (API Doc)`;
                    } else if (finding.type === 'openapi_spec') {
                        displayText = `${finding.value} (OpenAPI)`;
                    } else if (finding.type === 'aws_bucket') {
                        displayText = `${finding.value} (AWS S3)`;
                    } else if (finding.type === 'azure_blob') {
                        displayText = `${finding.value} (Azure Blob)`;
                    } else if (finding.type === 'gcp_bucket') {
                        displayText = `${finding.value} (GCP Storage)`;
                    } else if (finding.type === 'cloudflare_resource') {
                        displayText = `${finding.value} (Cloudflare)`;
                    } else if (finding.type === 'whois_info') {
                        displayText = `${finding.value}`;
                    } else if (finding.type === 'dns_history') {
                        displayText = `${finding.value} (DNS History)`;
                    } else if (finding.type === 'certificate_transparency') {
                        displayText = `${finding.value} (CT Log)`;
                    } else if (finding.type === 'social_media') {
                        displayText = `${finding.value} (Social Media)`;
                    } else if (finding.type === 'breach_data') {
                        displayText = `${finding.value} (Breach Data)`;
                    } else if (finding.type === 'security_header') {
                        displayText = `${finding.value} (Security Header)`;
                    } else if (finding.type === 'cors_issue') {
                        displayText = `${finding.value} (CORS Issue)`;
                    } else if (finding.type === 'csp_issue') {
                        displayText = `${finding.value} (CSP Issue)`;
                    }
                    
                    html += `<div class="finding-item">${displayText}</div>`;
                });
                
                if (groupFindings.length > 10) {
                    html += `<div class="finding-item text-muted">... and ${groupFindings.length - 10} more</div>`;
                }
            });
            
            return html;
        }

        // Export functions
        function exportReport(format) {
            if (format === 'json') {
                const dataStr = JSON.stringify(reportData, null, 2);
                const dataBlob = new Blob([dataStr], {type: 'application/json'});
                downloadBlob(dataBlob, 'arat-report.json');
            } else if (format === 'csv') {
                // Convert to CSV format
                let csv = 'Phase,Type,Value\n';
                Object.keys(reportData).forEach(key => {
                    if (key.startsWith('phase_')) {
                        const phaseData = reportData[key];
                        const findings = phaseData.findings || [];
                        findings.forEach(finding => {
                            csv += `${key},${finding.type || 'general'},${finding.value || finding}\n`;
                        });
                    }
                });
                const dataBlob = new Blob([csv], {type: 'text/csv'});
                downloadBlob(dataBlob, 'arat-report.csv');
            }
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Run new scan
        function runNewScan() {
            const urlParams = new URLSearchParams(window.location.search);
            const target = urlParams.get('target');
            if (target) {
                window.location.href = `/phases?target=${encodeURIComponent(target)}`;
            } else {
                window.location.href = '/phases';
            }
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 ARAT Report Page Loaded');
            loadReportData();
        });
    </script>
</body>
</html>
