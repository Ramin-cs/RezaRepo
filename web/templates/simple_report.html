<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARAT - Reconnaissance Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/hacker_theme.css" rel="stylesheet">
    <style>
        .finding-card {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }
        .finding-success {
            border-left: 4px solid #28a745;
        }
        .finding-info {
            border-left: 4px solid #17a2b8;
        }
        .finding-warning {
            border-left: 4px solid #ffc107;
        }
        .finding-item {
            background: #333;
            padding: 8px;
            margin: 3px 0;
            border-radius: 4px;
            font-size: 12px;
            font-family: monospace;
        }
        .phase-summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-crosshairs me-2"></i>ARAT
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link" href="/targets">Targets</a>
                <a class="nav-link" href="/phases">Phases</a>
                <a class="nav-link active" href="#">Report</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Report Header -->
        <div class="phase-summary">
            <div class="row">
                <div class="col-md-8">
                    <h2><i class="fas fa-file-alt me-2"></i>Reconnaissance Report</h2>
                    <h4 id="report-target">Target: Loading...</h4>
                    <p id="report-summary" class="mb-0">Generating report...</p>
                </div>
                <div class="col-md-4 text-end">
                    <button class="btn btn-light me-2" onclick="exportReport('json')">
                        <i class="fas fa-download me-2"></i>Export JSON
                    </button>
                    <button class="btn btn-outline-light" onclick="exportReport('csv')">
                        <i class="fas fa-file-csv me-2"></i>Export CSV
                    </button>
                </div>
            </div>
        </div>

        <!-- Phase Results -->
        <div id="phase-results-container">
            <div class="text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3">Loading reconnaissance results...</p>
            </div>
        </div>

        <!-- Summary Statistics -->
        <div class="row mt-4">
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-primary">
                            <i class="fas fa-target me-2"></i>Target
                        </h5>
                        <h3 id="stat-target" class="text-primary">-</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-success">
                            <i class="fas fa-check-circle me-2"></i>Phases
                        </h5>
                        <h3 id="stat-phases" class="text-success">-</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-info">
                            <i class="fas fa-search me-2"></i>Findings
                        </h5>
                        <h3 id="stat-findings" class="text-info">-</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-warning">
                            <i class="fas fa-clock me-2"></i>Duration
                        </h5>
                        <h3 id="stat-duration" class="text-warning">-</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="row mt-4">
            <div class="col-12 text-center">
                <button class="btn btn-primary me-2" onclick="runNewScan()">
                    <i class="fas fa-redo me-2"></i>Run New Scan
                </button>
                <button class="btn btn-secondary me-2" onclick="window.print()">
                    <i class="fas fa-print me-2"></i>Print Report
                </button>
                <button class="btn btn-info" onclick="window.location.href='/'">
                    <i class="fas fa-home me-2"></i>Back to Dashboard
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let reportData = {};

        // Load report data
        function loadReportData() {
            const urlParams = new URLSearchParams(window.location.search);
            const target = urlParams.get('target');
            const taskId = urlParams.get('task_id');
            
            console.log('Loading report for:', { target, taskId });
            
            if (target) {
                document.getElementById('report-target').textContent = `Target: ${target}`;
                document.getElementById('stat-target').textContent = target;
            }
            
            // Try to load from localStorage first
            const storedResults = localStorage.getItem('lastReconResults');
            if (storedResults) {
                try {
                    const parsedData = JSON.parse(storedResults);
                    console.log('📊 Loaded data from localStorage:', parsedData);
                    
                    // Use the stored data
                    reportData = parsedData;
                    
                    // Display the report
                    if (parsedData.results || parsedData.phaseResults) {
                        displayReport(parsedData);
                    } else {
                        showNoDataMessage();
                    }
                } catch (e) {
                    console.error('Error parsing stored results:', e);
                    showNoDataMessage();
                }
            } else {
                console.log('No stored results found in localStorage');
                showNoDataMessage();
            }
            
            // If we have taskId, try to fetch from API as backup
            if (taskId) {
                fetch(`/api/results/${taskId}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            console.log('📊 Loaded data from API:', data.results);
                            reportData = data.results;
                            displayReport(data.results);
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching results from API:', error);
                    });
            }
        }
        
        function showNoDataMessage() {
            const container = document.getElementById('phase-results-container');
            container.innerHTML = `
                <div class="text-center text-muted">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    No reconnaissance data found. Please run a scan first.
                    <br><small>Go to <a href="/phases">Phases page</a> to start reconnaissance.</small>
                </div>
            `;
        }

        // Display report
        function displayReport(data) {
            console.log('Displaying report:', data);
            
            const container = document.getElementById('phase-results-container');
            container.innerHTML = '';
            
            // Extract data from different possible structures
            let phaseData = {};
            let totalFindings = 0;
            let phaseCount = 0;
            
            // Check if data has results property
            if (data.results) {
                phaseData = data.results;
            } else if (data.phaseResults) {
                phaseData = data.phaseResults;
            } else {
                phaseData = data;
            }
            
            // Calculate statistics
            const phases = Object.keys(phaseData).filter(key => key.startsWith('phase_') || key.match(/^\d+$/));
            
            phases.forEach(phaseKey => {
                const phase = phaseData[phaseKey];
                if (phase && phase.findings) {
                    totalFindings += phase.findings.length;
                    phaseCount++;
                } else if (phase && Array.isArray(phase)) {
                    totalFindings += phase.length;
                    phaseCount++;
                }
            });
            
            // Update statistics
            document.getElementById('stat-phases').textContent = phaseCount || phases.length;
            document.getElementById('stat-findings').textContent = totalFindings;
            document.getElementById('stat-duration').textContent = data.duration || 'N/A';
            
            // Update summary
            document.getElementById('report-summary').textContent = 
                `Completed ${phaseCount || phases.length} phases with ${totalFindings} total findings`;
            
            // Display each phase
            if (phases.length > 0) {
                phases.forEach(phaseKey => {
                    const phase = phaseData[phaseKey];
                    if (phase) {
                        const phaseDiv = createPhaseCard(phaseKey, phase);
                        container.appendChild(phaseDiv);
                    }
                });
            } else {
                showNoDataMessage();
            }
        }

        // Create phase card
        function createPhaseCard(phaseKey, phaseData) {
            const phaseNumber = phaseKey.replace('phase_', '');
            const phaseNames = {
                '1': 'Real IP Extraction',
                '2': 'Subdomain Discovery',
                '3': 'Port Scanning',
                '4': 'Technology Detection',
                '5': 'Directory Discovery',
                '6': 'Parameter Discovery',
                '7': 'Endpoint Discovery',
                '8': 'Cloud Analysis',
                '9': 'OSINT Analysis',
                '10': 'Vulnerability Assessment'
            };
            
            const phaseName = phaseNames[phaseNumber] || `Phase ${phaseNumber}`;
            let findings = [];
            let status = 'completed';
            
            // Extract findings from different possible structures
            if (phaseData.findings) {
                findings = phaseData.findings;
            } else if (Array.isArray(phaseData)) {
                findings = phaseData;
            } else if (phaseData.real_ips) {
                findings = phaseData.real_ips.map(ip => ({ type: 'ip', value: ip }));
            } else if (phaseData.subdomains) {
                findings = phaseData.subdomains.map(sub => ({ type: 'subdomain', value: sub }));
            } else if (phaseData.open_ports) {
                findings = phaseData.open_ports.map(port => ({ type: 'port', value: port }));
            } else if (phaseData.technologies) {
                findings = phaseData.technologies.map(tech => ({ type: 'technology', value: tech }));
            } else if (phaseData.directories) {
                findings = phaseData.directories.map(dir => ({ type: 'directory', value: dir }));
            } else if (phaseData.parameters) {
                findings = phaseData.parameters.map(param => ({ type: 'parameter', value: param }));
            } else if (phaseData.ip_mapping) {
                // Phase 1: IP mapping with detailed info
                findings = Object.keys(phaseData.ip_mapping).map(ip => ({
                    type: 'ip_mapping',
                    value: ip,
                    details: phaseData.ip_mapping[ip]
                }));
            } else if (phaseData.subdomain_details) {
                // Phase 2: Subdomain details with status codes
                findings = Object.keys(phaseData.subdomain_details).map(sub => ({
                    type: 'subdomain_detail',
                    value: sub,
                    details: phaseData.subdomain_details[sub]
                }));
            } else if (phaseData.swagger_endpoints || phaseData.js_endpoints) {
                // Phase 7: Endpoint discoveries
                findings = [];
                if (phaseData.swagger_endpoints) {
                    findings = findings.concat(phaseData.swagger_endpoints.map(endpoint => ({
                        type: 'swagger_endpoint',
                        value: endpoint.url || endpoint,
                        details: endpoint
                    })));
                }
                if (phaseData.js_endpoints) {
                    findings = findings.concat(phaseData.js_endpoints.map(endpoint => ({
                        type: 'js_endpoint',
                        value: endpoint.url || endpoint,
                        details: endpoint
                    })));
                }
            } else if (phaseData.account_takeover_vulns) {
                // Phase 10: Account takeover vulnerabilities
                findings = phaseData.account_takeover_vulns.map(vuln => ({
                    type: 'account_takeover',
                    value: vuln.type || vuln,
                    details: vuln
                }));
            }
            
            if (phaseData.status) {
                status = phaseData.status;
            }
            
            const cardDiv = document.createElement('div');
            cardDiv.className = `finding-card finding-${status === 'completed' ? 'success' : 'warning'}`;
            
            cardDiv.innerHTML = `
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">
                        <i class="fas fa-${status === 'completed' ? 'check-circle text-success' : 'exclamation-triangle text-warning'} me-2"></i>
                        Phase ${phaseNumber}: ${phaseName}
                    </h5>
                    <span class="badge bg-${status === 'completed' ? 'success' : 'warning'}">
                        ${findings.length} findings
                    </span>
                </div>
                <div class="phase-findings">
                    ${formatPhaseFindings({ findings: findings, ...phaseData })}
                </div>
            `;
            
            return cardDiv;
        }

        // Format phase findings
        function formatPhaseFindings(phaseData) {
            let html = '';
            const findings = phaseData.findings || [];
            
            if (findings.length === 0) {
                // Check for direct properties
                const directProps = ['real_ips', 'subdomains', 'open_ports', 'technologies', 'directories', 'parameters'];
                let hasDirectData = false;
                
                directProps.forEach(prop => {
                    if (phaseData[prop] && phaseData[prop].length > 0) {
                        hasDirectData = true;
                        html += `<div class="finding-category mb-2">
                            <strong class="text-info">${prop.replace('_', ' ').charAt(0).toUpperCase() + prop.replace('_', ' ').slice(1)}:</strong>
                        </div>`;
                        
                        phaseData[prop].slice(0, 10).forEach(item => {
                            html += `<div class="finding-item">${item}</div>`;
                        });
                        
                        if (phaseData[prop].length > 10) {
                            html += `<div class="finding-item text-muted">... and ${phaseData[prop].length - 10} more</div>`;
                        }
                    }
                });
                
                if (!hasDirectData) {
                    return '<div class="text-muted">No specific findings to display</div>';
                }
                
                return html;
            }
            
            // Group findings by type
            const groupedFindings = {};
            findings.forEach(finding => {
                const type = finding.type || 'general';
                if (!groupedFindings[type]) {
                    groupedFindings[type] = [];
                }
                groupedFindings[type].push(finding);
            });
            
            // Display each group
            Object.keys(groupedFindings).forEach(type => {
                const groupFindings = groupedFindings[type];
                html += `<div class="finding-category mb-2">
                    <strong class="text-info">${type.charAt(0).toUpperCase() + type.slice(1)}:</strong>
                </div>`;
                
                groupFindings.slice(0, 10).forEach(finding => {
                    let displayText = finding.value || finding;
                    
                    // Enhanced display for different types
                    if (finding.type === 'ip_mapping' && finding.details) {
                        displayText = `${finding.value}`;
                        if (finding.details.reverse_dns) {
                            displayText += ` (${finding.details.reverse_dns})`;
                        }
                        if (finding.details.source) {
                            displayText += ` [${finding.details.source}]`;
                        }
                    } else if (finding.type === 'subdomain_detail' && finding.details) {
                        displayText = `${finding.value}`;
                        if (finding.details.status_code) {
                            displayText += ` [${finding.details.status_code}]`;
                        }
                        if (finding.details.source) {
                            displayText += ` (${finding.details.source})`;
                        }
                    } else if (finding.type === 'swagger_endpoint' && finding.details) {
                        displayText = `${finding.value}`;
                        if (finding.details.title) {
                            displayText += ` - ${finding.details.title}`;
                        }
                    } else if (finding.type === 'account_takeover' && finding.details) {
                        displayText = `${finding.value}`;
                        if (finding.details.severity) {
                            displayText += ` [${finding.details.severity}]`;
                        }
                        if (finding.details.url) {
                            displayText += ` - ${finding.details.url}`;
                        }
                    } else if (finding.type === 'swagger_endpoint' && finding.details) {
                        displayText = `${finding.value}`;
                        if (finding.details.title) {
                            displayText += ` - ${finding.details.title}`;
                        }
                        if (finding.details.status_code) {
                            displayText += ` [${finding.details.status_code}]`;
                        }
                    } else if (finding.type === 'js_endpoint' && finding.details) {
                        displayText = `${finding.value}`;
                        if (finding.details.source) {
                            displayText += ` (${finding.details.source})`;
                        }
                    } else if (finding.type === 'directory' && finding.details) {
                        displayText = `${finding.value}`;
                        if (finding.details.status_code) {
                            displayText += ` [${finding.details.status_code}]`;
                        }
                        if (finding.details.content_length) {
                            displayText += ` (${finding.details.content_length} bytes)`;
                        }
                    } else if (finding.type === 'parameter' && finding.details) {
                        displayText = `${finding.value}`;
                        if (finding.details.risk_level) {
                            displayText += ` [${finding.details.risk_level}]`;
                        }
                        if (finding.details.source) {
                            displayText += ` (${finding.details.source})`;
                        }
                    }
                    
                    html += `<div class="finding-item">${displayText}</div>`;
                });
                
                if (groupFindings.length > 10) {
                    html += `<div class="finding-item text-muted">... and ${groupFindings.length - 10} more</div>`;
                }
            });
            
            return html;
        }

        // Export functions
        function exportReport(format) {
            if (format === 'json') {
                const dataStr = JSON.stringify(reportData, null, 2);
                const dataBlob = new Blob([dataStr], {type: 'application/json'});
                downloadBlob(dataBlob, 'arat-report.json');
            } else if (format === 'csv') {
                // Convert to CSV format
                let csv = 'Phase,Type,Value\n';
                Object.keys(reportData).forEach(key => {
                    if (key.startsWith('phase_')) {
                        const phaseData = reportData[key];
                        const findings = phaseData.findings || [];
                        findings.forEach(finding => {
                            csv += `${key},${finding.type || 'general'},${finding.value || finding}\n`;
                        });
                    }
                });
                const dataBlob = new Blob([csv], {type: 'text/csv'});
                downloadBlob(dataBlob, 'arat-report.csv');
            }
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Run new scan
        function runNewScan() {
            const urlParams = new URLSearchParams(window.location.search);
            const target = urlParams.get('target');
            if (target) {
                window.location.href = `/phases?target=${encodeURIComponent(target)}`;
            } else {
                window.location.href = '/phases';
            }
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 ARAT Report Page Loaded');
            loadReportData();
        });
    </script>
</body>
</html>
