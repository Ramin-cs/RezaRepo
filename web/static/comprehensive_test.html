<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprehensive Phases Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1><i class="fas fa-flask me-2"></i>Comprehensive Phases Test</h1>
        
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-cogs me-2"></i>Test Controls</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <button class="btn btn-primary" onclick="testAPI()">
                                <i class="fas fa-api me-2"></i>Test API
                            </button>
                            <button class="btn btn-success" onclick="testLoadPhases()">
                                <i class="fas fa-download me-2"></i>Load Phases
                            </button>
                            <button class="btn btn-warning" onclick="testHardcoded()">
                                <i class="fas fa-code me-2"></i>Load Hardcoded
                            </button>
                            <button class="btn btn-info" onclick="testForm()">
                                <i class="fas fa-form me-2"></i>Test Form
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-info-circle me-2"></i>Status</h5>
                    </div>
                    <div class="card-body">
                        <div id="status" class="alert alert-info">
                            <i class="fas fa-clock me-2"></i>Ready to test...
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-list me-2"></i>Main Page Phases</h5>
                    </div>
                    <div class="card-body">
                        <div id="phases-container">
                            <div class="text-center">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <p class="mt-2">Ready to load phases...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-window-maximize me-2"></i>Modal Phases</h5>
                    </div>
                    <div class="card-body">
                        <div id="modal-phases-container">
                            <div class="text-center">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <p class="mt-2">Ready to load phases...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="mt-4">
            <div class="card">
                <div class="card-header">
                    <h5><i class="fas fa-terminal me-2"></i>Console Logs</h5>
                </div>
                <div class="card-body">
                    <div id="console-logs" class="bg-dark text-light p-3" style="height: 300px; overflow-y: scroll; font-family: monospace; font-size: 12px;"></div>
                </div>
            </div>
        </div>
        
        <!-- Test Form -->
        <div class="mt-4">
            <div class="card">
                <div class="card-header">
                    <h5><i class="fas fa-form me-2"></i>Test Form</h5>
                </div>
                <div class="card-body">
                    <form id="test-form">
                        <div class="mb-3">
                            <label for="test-target" class="form-label">Target</label>
                            <input type="text" class="form-control" id="test-target" value="example.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Selected Phases</label>
                            <div id="selected-phases">
                                <small class="text-muted">Select phases above first</small>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-play me-2"></i>Test Submit
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedPhases = [];
        
        function log(message, type = 'info') {
            const logs = document.getElementById('console-logs');
            const timestamp = new Date().toLocaleTimeString();
            const icon = type === 'error' ? '❌' : type === 'success' ? '✅' : type === 'warning' ? '⚠️' : 'ℹ️';
            logs.innerHTML += `<span class="text-${type === 'error' ? 'danger' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : 'light'}">[${timestamp}] ${icon} ${message}</span><br>`;
            logs.scrollTop = logs.scrollHeight;
            console.log(message);
        }
        
        function updateStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.className = `alert alert-${type}`;
            status.innerHTML = `<i class="fas fa-${type === 'success' ? 'check' : type === 'error' ? 'times' : type === 'warning' ? 'exclamation' : 'info'}-circle me-2"></i>${message}`;
        }
        
        function testAPI() {
            log('🧪 Testing API endpoint...');
            updateStatus('Testing API...', 'info');
            
            fetch('/api/phases')
                .then(response => {
                    log(`📡 Response status: ${response.status}`, response.ok ? 'success' : 'error');
                    return response.json();
                })
                .then(data => {
                    log(`📋 Response data received: ${data.success ? 'SUCCESS' : 'FAILED'}`, data.success ? 'success' : 'error');
                    if (data.success) {
                        log(`✅ Found ${data.phases.length} phases`, 'success');
                        updateStatus(`API Working: ${data.phases.length} phases found`, 'success');
                    } else {
                        log(`❌ API Error: ${data.error}`, 'error');
                        updateStatus(`API Error: ${data.error}`, 'error');
                    }
                })
                .catch(error => {
                    log(`❌ Fetch Error: ${error.message}`, 'error');
                    updateStatus(`Connection Error: ${error.message}`, 'error');
                });
        }
        
        function testLoadPhases() {
            log('📋 Testing phase loading...');
            updateStatus('Loading phases...', 'info');
            
            fetch('/api/phases')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        loadPhasesToContainer('phases-container', data.phases, true);
                        loadPhasesToContainer('modal-phases-container', data.phases, false);
                        log(`✅ ${data.phases.length} phases loaded successfully`, 'success');
                        updateStatus(`Phases Loaded: ${data.phases.length} phases`, 'success');
                    } else {
                        log(`❌ Failed to load phases: ${data.error}`, 'error');
                        updateStatus(`Failed: ${data.error}`, 'error');
                    }
                })
                .catch(error => {
                    log(`❌ Error loading phases: ${error.message}`, 'error');
                    updateStatus(`Error: ${error.message}`, 'error');
                });
        }
        
        function testHardcoded() {
            log('🔄 Testing hardcoded phases...');
            updateStatus('Loading hardcoded phases...', 'info');
            
            const hardcodedPhases = [
                {number: 1, name: "Real IP Extraction", description: "Extract real IP address and CDN bypass", dependencies: []},
                {number: 2, name: "Subdomain Discovery", description: "Discover subdomains (active/passive)", dependencies: [1]},
                {number: 3, name: "Port Scanning", description: "Scan ports and detect services", dependencies: [1]},
                {number: 4, name: "Technology Detection", description: "Detect web technologies", dependencies: [1]},
                {number: 5, name: "Directory Discovery", description: "Find directories and files", dependencies: [1]}
            ];
            
            loadPhasesToContainer('phases-container', hardcodedPhases, true);
            loadPhasesToContainer('modal-phases-container', hardcodedPhases, false);
            
            log(`✅ ${hardcodedPhases.length} hardcoded phases loaded`, 'success');
            updateStatus(`Hardcoded: ${hardcodedPhases.length} phases loaded`, 'success');
        }
        
        function testForm() {
            log('📝 Testing form submission...');
            updateStatus('Testing form...', 'info');
            
            const selectedCheckboxes = document.querySelectorAll('input[name="phases"]:checked');
            selectedPhases = Array.from(selectedCheckboxes).map(cb => parseInt(cb.value));
            
            const target = document.getElementById('test-target').value;
            
            log(`🎯 Target: ${target}`, 'info');
            log(`📋 Selected phases: [${selectedPhases.join(', ')}]`, 'info');
            
            if (!target) {
                log('❌ No target specified', 'error');
                updateStatus('Error: No target specified', 'error');
                return;
            }
            
            if (selectedPhases.length === 0) {
                log('❌ No phases selected', 'error');
                updateStatus('Error: No phases selected', 'error');
                return;
            }
            
            log(`✅ Form validation passed`, 'success');
            updateStatus(`Form OK: Target=${target}, Phases=[${selectedPhases.join(',')}]`, 'success');
            
            // Update selected phases display
            const selectedDiv = document.getElementById('selected-phases');
            selectedDiv.innerHTML = selectedPhases.map(p => `<span class="badge bg-primary me-1">Phase ${p}</span>`).join('') || '<small class="text-muted">No phases selected</small>';
        }
        
        function loadPhasesToContainer(containerId, phases, showButtons = true) {
            log(`📦 Loading phases to container: ${containerId}`);
            const container = document.getElementById(containerId);
            
            if (container) {
                log(`✅ Container found: ${containerId}`);
                container.innerHTML = '';
                
                phases.forEach(phase => {
                    const phaseDiv = document.createElement('div');
                    phaseDiv.className = 'form-check mb-2';
                    phaseDiv.innerHTML = `
                        <input class="form-check-input" type="checkbox" value="${phase.number}" id="${containerId}_phase_${phase.number}" name="phases" onchange="updateSelectedPhases()">
                        <label class="form-check-label" for="${containerId}_phase_${phase.number}">
                            <strong>Phase ${phase.number}:</strong> ${phase.name}
                            <br><small class="text-muted">${phase.description}</small>
                            ${phase.dependencies.length > 0 ? `<br><small class="text-warning">Dependencies: ${phase.dependencies.join(', ')}</small>` : ''}
                        </label>
                    `;
                    container.appendChild(phaseDiv);
                });
                
                log(`✅ ${phases.length} phases added to ${containerId}`, 'success');
                
                if (showButtons) {
                    const buttonsDiv = document.createElement('div');
                    buttonsDiv.className = 'mt-3 mb-3';
                    buttonsDiv.innerHTML = `
                        <button type="button" class="btn btn-sm btn-outline-primary me-2" onclick="selectAllPhases()">
                            <i class="fas fa-check-square"></i> Select All
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="selectNoPhases()">
                            <i class="fas fa-square"></i> Select None
                        </button>
                    `;
                    container.appendChild(buttonsDiv);
                    log(`✅ Select buttons added to ${containerId}`);
                }
            } else {
                log(`❌ Container not found: ${containerId}`, 'error');
            }
        }
        
        function selectAllPhases() {
            const checkboxes = document.querySelectorAll('input[name="phases"]');
            checkboxes.forEach(checkbox => {
                checkbox.checked = true;
            });
            updateSelectedPhases();
            log('✅ All phases selected', 'success');
        }
        
        function selectNoPhases() {
            const checkboxes = document.querySelectorAll('input[name="phases"]');
            checkboxes.forEach(checkbox => {
                checkbox.checked = false;
            });
            updateSelectedPhases();
            log('✅ No phases selected', 'success');
        }
        
        function updateSelectedPhases() {
            const selectedCheckboxes = document.querySelectorAll('input[name="phases"]:checked');
            selectedPhases = Array.from(selectedCheckboxes).map(cb => parseInt(cb.value));
            
            const selectedDiv = document.getElementById('selected-phases');
            selectedDiv.innerHTML = selectedPhases.map(p => `<span class="badge bg-primary me-1">Phase ${p}</span>`).join('') || '<small class="text-muted">No phases selected</small>';
        }
        
        // Form submission handler
        document.getElementById('test-form').addEventListener('submit', function(e) {
            e.preventDefault();
            testForm();
        });
        
        // Auto-test on page load
        document.addEventListener('DOMContentLoaded', function() {
            log('🚀 Comprehensive test page loaded', 'success');
            updateStatus('Ready for testing', 'success');
            
            // Auto-run tests with delays
            setTimeout(() => {
                testAPI();
                setTimeout(() => {
                    testLoadPhases();
                }, 1000);
            }, 500);
        });
    </script>
</body>
</html>
