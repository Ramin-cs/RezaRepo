<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Simple Test</h1>
        
        <div class="mb-3">
            <button class="btn btn-primary" onclick="testLoad()">Test Load Phases</button>
        </div>
        
        <div id="phases-container">
            <div class="alert alert-info">Ready to test...</div>
        </div>
        
        <div class="mt-4">
            <h4>Console Output:</h4>
            <div id="output" class="bg-dark text-light p-3" style="height: 200px; overflow-y: scroll; font-family: monospace;"></div>
        </div>
    </div>

    <script>
        function log(msg) {
            const output = document.getElementById('output');
            const time = new Date().toLocaleTimeString();
            output.innerHTML += `[${time}] ${msg}<br>`;
            output.scrollTop = output.scrollHeight;
            console.log(msg);
        }
        
        function testLoad() {
            log('🧪 Testing phase loading...');
            
            fetch('/api/phases')
                .then(response => {
                    log(`Response status: ${response.status}`);
                    return response.json();
                })
                .then(data => {
                    log(`Data received: ${data.success ? 'SUCCESS' : 'FAILED'}`);
                    if (data.success) {
                        log(`Phases count: ${data.phases.length}`);
                        loadPhases(data.phases);
                    } else {
                        log(`Error: ${data.error}`);
                    }
                })
                .catch(error => {
                    log(`Error: ${error.message}`);
                });
        }
        
        function loadPhases(phases) {
            log('📦 Loading phases...');
            
            const container = document.getElementById('phases-container');
            if (container) {
                container.innerHTML = '';
                
                phases.forEach(phase => {
                    const div = document.createElement('div');
                    div.className = 'form-check mb-2';
                    div.innerHTML = `
                        <input class="form-check-input" type="checkbox" value="${phase.number}" id="phase_${phase.number}" name="phases">
                        <label class="form-check-label" for="phase_${phase.number}">
                            <strong>Phase ${phase.number}:</strong> ${phase.name}
                            <br><small class="text-muted">${phase.description}</small>
                        </label>
                    `;
                    container.appendChild(div);
                });
                
                log(`✅ ${phases.length} phases loaded successfully`);
            }
        }
        
        // Auto test on load
        document.addEventListener('DOMContentLoaded', function() {
            log('🚀 Page loaded');
            setTimeout(() => {
                testLoad();
            }, 500);
        });
    </script>
</body>
</html>
