<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>JavaScript Test</h1>
        
        <div class="mb-3">
            <button class="btn btn-primary" onclick="testFetch()">Test Fetch</button>
            <button class="btn btn-secondary" onclick="testLoadPhases()">Load Phases</button>
        </div>
        
        <div id="phases-container">
            <div class="alert alert-info">Ready to test...</div>
        </div>
        
        <div id="modal-phases-container">
            <div class="alert alert-info">Modal container ready...</div>
        </div>
        
        <div class="mt-4">
            <h4>Console Logs:</h4>
            <div id="console-logs" class="bg-dark text-light p-3" style="height: 200px; overflow-y: scroll; font-family: monospace;"></div>
        </div>
    </div>

    <script>
        function log(message) {
            const logs = document.getElementById('console-logs');
            const timestamp = new Date().toLocaleTimeString();
            logs.innerHTML += `[${timestamp}] ${message}<br>`;
            logs.scrollTop = logs.scrollHeight;
            console.log(message);
        }
        
        function testFetch() {
            log('🧪 Testing fetch to /api/phases...');
            
            fetch('/api/phases')
                .then(response => {
                    log(`📡 Response status: ${response.status}`);
                    log(`📡 Response headers: ${response.headers.get('content-type')}`);
                    return response.json();
                })
                .then(data => {
                    log(`📋 Response data: ${JSON.stringify(data).substring(0, 100)}...`);
                    if (data.success) {
                        log(`✅ Success: ${data.phases.length} phases found`);
                    } else {
                        log(`❌ API Error: ${data.error}`);
                    }
                })
                .catch(error => {
                    log(`❌ Fetch Error: ${error.message}`);
                    log(`❌ Error stack: ${error.stack}`);
                });
        }
        
        function testLoadPhases() {
            log('📋 Testing load phases...');
            
            fetch('/api/phases')
                .then(response => response.json())
                .then(data => {
                    log('📋 Data received, loading phases...');
                    
                    if (data.success) {
                        loadPhasesToContainer('phases-container', data.phases, true);
                        loadPhasesToContainer('modal-phases-container', data.phases, false);
                        log(`✅ ${data.phases.length} phases loaded successfully`);
                    } else {
                        log(`❌ Failed to load phases: ${data.error}`);
                    }
                })
                .catch(error => {
                    log(`❌ Error loading phases: ${error.message}`);
                });
        }
        
        function loadPhasesToContainer(containerId, phases, showButtons = true) {
            log(`📦 Loading phases to container: ${containerId}`);
            const container = document.getElementById(containerId);
            
            if (container) {
                log(`✅ Container found: ${containerId}`);
                container.innerHTML = '';
                
                phases.forEach(phase => {
                    const phaseDiv = document.createElement('div');
                    phaseDiv.className = 'form-check mb-2';
                    phaseDiv.innerHTML = `
                        <input class="form-check-input" type="checkbox" value="${phase.number}" id="${containerId}_phase_${phase.number}" name="phases">
                        <label class="form-check-label" for="${containerId}_phase_${phase.number}">
                            <strong>Phase ${phase.number}:</strong> ${phase.name}
                        </label>
                    `;
                    container.appendChild(phaseDiv);
                });
                
                log(`✅ ${phases.length} phases added to ${containerId}`);
            } else {
                log(`❌ Container not found: ${containerId}`);
            }
        }
        
        // Auto-test on page load
        document.addEventListener('DOMContentLoaded', function() {
            log('🚀 Page loaded, starting auto-test...');
            setTimeout(() => {
                testFetch();
                setTimeout(() => {
                    testLoadPhases();
                }, 1000);
            }, 500);
        });
    </script>
</body>
</html>
