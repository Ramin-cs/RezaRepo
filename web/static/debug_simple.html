<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Debug</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Simple Debug Test</h1>
        
        <div class="mb-3">
            <button class="btn btn-primary" onclick="testNow()">Test Now</button>
        </div>
        
        <div id="phases-container">
            <div class="alert alert-info">Ready...</div>
        </div>
        
        <div id="modal-phases-container">
            <div class="alert alert-info">Modal ready...</div>
        </div>
        
        <div class="mt-4">
            <h4>Console Output:</h4>
            <div id="output" class="bg-dark text-light p-3" style="height: 200px; overflow-y: scroll; font-family: monospace;"></div>
        </div>
    </div>

    <script>
        function log(msg) {
            const output = document.getElementById('output');
            const time = new Date().toLocaleTimeString();
            output.innerHTML += `[${time}] ${msg}<br>`;
            output.scrollTop = output.scrollHeight;
            console.log(msg);
        }
        
        function testNow() {
            log('🧪 Starting test...');
            
            // Test 1: Check containers
            const container1 = document.getElementById('phases-container');
            const container2 = document.getElementById('modal-phases-container');
            log(`Container 1: ${container1 ? 'FOUND' : 'NOT FOUND'}`);
            log(`Container 2: ${container2 ? 'FOUND' : 'NOT FOUND'}`);
            
            // Test 2: Try fetch
            log('📡 Testing fetch...');
            fetch('/api/phases')
                .then(response => {
                    log(`Response status: ${response.status}`);
                    return response.json();
                })
                .then(data => {
                    log(`Data received: ${data.success ? 'SUCCESS' : 'FAILED'}`);
                    if (data.success) {
                        log(`Phases count: ${data.phases.length}`);
                        loadPhases(data.phases);
                    } else {
                        log(`Error: ${data.error}`);
                    }
                })
                .catch(error => {
                    log(`Fetch error: ${error.message}`);
                });
        }
        
        function loadPhases(phases) {
            log('📦 Loading phases...');
            
            const container1 = document.getElementById('phases-container');
            const container2 = document.getElementById('modal-phases-container');
            
            if (container1) {
                container1.innerHTML = '';
                phases.forEach(phase => {
                    const div = document.createElement('div');
                    div.className = 'form-check';
                    div.innerHTML = `
                        <input class="form-check-input" type="checkbox" value="${phase.number}" id="p1_${phase.number}" name="phases">
                        <label class="form-check-label" for="p1_${phase.number}">
                            Phase ${phase.number}: ${phase.name}
                        </label>
                    `;
                    container1.appendChild(div);
                });
                log(`✅ ${phases.length} phases loaded to container 1`);
            }
            
            if (container2) {
                container2.innerHTML = '';
                phases.forEach(phase => {
                    const div = document.createElement('div');
                    div.className = 'form-check';
                    div.innerHTML = `
                        <input class="form-check-input" type="checkbox" value="${phase.number}" id="p2_${phase.number}" name="phases">
                        <label class="form-check-label" for="p2_${phase.number}">
                            Phase ${phase.number}: ${phase.name}
                        </label>
                    `;
                    container2.appendChild(div);
                });
                log(`✅ ${phases.length} phases loaded to container 2`);
            }
        }
        
        // Auto test on load
        document.addEventListener('DOMContentLoaded', function() {
            log('🚀 Page loaded');
            setTimeout(() => {
                testNow();
            }, 500);
        });
    </script>
</body>
</html>
