<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تبدیل شده از عکس</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="image-container" style="width: 400px; height: 300px; background-color: #ffffff;">
        <div class="image-element" style="position: absolute; left: 0px; top: 0px; width: 400px; height: 300px; background: linear-gradient(135deg, #f0f0f0, #e0e0e0); border: 2px solid #ccc; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #666;">
                🖼️ تصویر اصلی
              </div>
        <div class="image-element" style="position: absolute; left: 20px; top: 0px; width: 380px; height: 300px; background: linear-gradient(135deg, #f0f0f0, #e0e0e0); border: 2px solid #ccc; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #666;">
                🖼️ عکس محصول
              </div>
        <div class="image-element" style="position: absolute; left: 40px; top: 0px; width: 360px; height: 300px; background: linear-gradient(135deg, #f0f0f0, #e0e0e0); border: 2px solid #ccc; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #666;">
                🖼️ تصویر گالری

        <div class="image-element" style="position: absolute; left: 60px; top: 0px; width: 340px; height: 300px; background: linear-gradient(135deg, #f0f0f0, #e0e0e0); border: 2px solid #ccc; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #666;">

              </div>
        <div class="image-element" style="position: absolute; left: 80px; top: 0px; width: 320px; height: 300px; background: linear-gradient(135deg, #f0f0f0, #e0e0e0); border: 2px solid #ccc; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #666;">
                🖼️ آیکون
              </div>
        <div class="image-element" style="position: absolute; left: 300px; top: 0px; width: 100px; height: 300px; background: linear-gradient(135deg, #f0f0f0, #e0e0e0); border: 2px solid #ccc; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #666;">
                🖼️ تصویر
              </div>
        <div class="image-element" style="position: absolute; left: 320px; top: 0px; width: 80px; height: 300px; background: linear-gradient(135deg, #f0f0f0, #e0e0e0); border: 2px solid #ccc; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #666;">

              </div>

                🖼️ گرافیک
              </div>
        <div class="image-element" style="position: absolute; left: 0px; top: 20px; width: 100px; height: 280px; background: linear-gradient(135deg, #f0f0f0, #e0e0e0); border: 2px solid #ccc; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #666;">
                🖼️ تصویر کوچک
              </div>
        <div class="image-element" style="position: absolute; left: 20px; top: 20px; width: 80px; height: 280px; background: linear-gradient(135deg, #f0f0f0, #e0e0e0); border: 2px solid #ccc; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #666;">

                🖼️ تصویر اصلی
              </div>
        <div class="text-element" style="position: absolute; left: 100px; top: 20px; width: 200px; height: 40px; color: #000000; display: flex; align-items: center; justify-content: center; background-color: rgba(255,255,255,0.9); border: 1px solid #ddd; border-radius: 4px; padding: 8px; font-size: 14px; text-align: center;">

                محتوای صفحه
              </div>
        <div class="text-element" style="position: absolute; left: 160px; top: 20px; width: 140px; height: 40px; color: #000000; display: flex; align-items: center; justify-content: center; background-color: rgba(255,255,255,0.9); border: 1px solid #ddd; border-radius: 4px; padding: 8px; font-size: 14px; text-align: center;">
                نکته مهم
              </div>
        
        <!-- تصویر اصلی برای مقایسه -->
        <div class="original-image" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('original-image.jpg'); background-size: contain; background-repeat: no-repeat; background-position: center; opacity: 0.1; pointer-events: none;"></div>
    </div>
</body>
</html>
