version: '3.8'

services:
  open-redirect-scanner:
    build: .
    container_name: open-redirect-scanner
    volumes:
      - ./scan_results:/app/scan_results
      - ./logs:/app/logs
    environment:
      - DISPLAY=:99
    command: python run_scanner.py https://httpbin.org scan_results 10
    networks:
      - scanner-network

  chrome-headless:
    image: selenium/standalone-chrome:latest
    container_name: chrome-headless
    ports:
      - "4444:4444"
    environment:
      - SE_NODE_MAX_SESSIONS=10
      - SE_NODE_SESSION_TIMEOUT=300
    networks:
      - scanner-network

networks:
  scanner-network:
    driver: bridge

volumes:
  scan_results:
  logs: