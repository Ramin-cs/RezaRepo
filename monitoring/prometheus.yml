global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'arat'
    static_configs:
      - targets: ['arat-dev:8080']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-dev:6379']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-dev:5432']

  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch-dev:9200']